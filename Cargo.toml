[package]
name = "package_3l14"
autobins = false
autotests = false
autobenches = false
autoexamples = false
edition.workspace = true
version.workspace = true
build = "./src/build_common.rs"

[lib]
path = "./src/dummy.rs"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"
members = ["./src/engine/*", "src/exe/*", "src/build"]

[dependencies]

[workspace.dependencies]
build_3l14 = { path = "./src/build" }
proc_macros_3l14 = { path = "./src/macros" }

asset_3l14 = { path = "./src/engine/asset_3l14" }
containers_3l14 = { path = "./src/engine/containers_3l14" }
debug_3l14 = { path = "./src/engine/debug_3l14" }
graphics_3l14 = { path = "./src/engine/graphics_3l14" }
input_3l14 = { path = "./src/engine/input_3l14" }
interop_3l14 = { path = "./src/engine/interop_3l14" }
latch_3l14 = { path = "./src/engine/latch_3l14" }
math_3l14 = { path = "./src/engine/math_3l14" }
nab_3l14 = { path = "./src/engine/nab_3l14" }
source_defs_3l14 = { path = "./src/engine/source_defs_3l14" }
world_3l14 = { path = "./src/engine/world_3l14" }

#egui_wgpu_backend = "0.33.0"
#puffin = "0.19.1"
approx = "0.5.1"
arc-swap = { version = "1.9.2", features = ["weak"] } # TODO: remove -- should not be necessary
arrayvec = { version = "0.7.8", features = ["serde", "std"] } # re-evaluate
base64 = "0.23.0"
bitcode = { version = "0.6.9", features = ["arrayvec", "glam", "std"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
colog = "1.4.0"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
dashmap = { version = "6.1.0" }
egui = { version = "0.36.0", features = ["persistence"] }
egui-wgpu = { version = "0.36.0" }
enumflags2 = { version = "0.7.12", features = ["serde"] }
erased-serde = "0.4.10"
futures = { version = "0.3.33", features = ["thread-pool"] }
glam = { version = "0.33.2", features = ["serde", "approx"] }
gltf = "1.4.1"
half = "2.7.1"
hassle-rs = "0.12.0"
image = "0.25.10"
impls = "1.0.3"
indexmap = "2.14.0"
inventory = "0.3.24"
is-root = "0.1.3"
log = { version = "0.4.33", features = ["std", "kv", "max_level_debug"] }
logos = { version = "0.15.1", features = ["logos-derive"] } # 16 dyn lifetimes
metrohash = "1.0.7"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
parking_lot = "0.12.5"
paste ="1.0.15"
puffin = "0.20.0"
puffin_egui = "0.30.0"
puffin_http = "0.17.0"
rand = "0.10.2"
regex = "1.13.1"
sdl2 = { version = "0.38.0", features = ["ttf", "raw-window-handle"] }
serde = { version = "1.0.229", features = ["derive"] }
smallvec = "1.15.1"
toml = { version = "1.1.4", features = ["parse"] }
triomphe = { version = "0.1.16", features = ["arc-swap"] }
unicase = "2.9.0"
walkdir = "2.5.0"
wgpu = { version = "30.0.0", features = ["spirv"] }
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }

# workspace build-dependencies
symlink = "0.1.0"
winres = "0.1.12"

[build-dependencies]
build_3l14.workspace = true
symlink.workspace = true
